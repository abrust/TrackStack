  // ─── Column Drag-and-Drop: Single Smart Handler ──────────────────────────

  function clearAllDragClasses() {
    document.querySelectorAll('.col-card').forEach(el => {
      el.classList.remove(
        'column-drag-over-left', 'column-drag-over-right',
        'column-drag-over-top', 'column-drag-over-bottom',
        'column-drag-combine'
      );
    });
  }

  function cleanupStackGroups() {
    const counts = {};
    state.columns.forEach(col => {
      if (col.stackGroup) counts[col.stackGroup] = (counts[col.stackGroup] || 0) + 1;
    });
    state.columns.forEach(col => {
      if (col.stackGroup && counts[col.stackGroup] < 2) col.stackGroup = null;
    });
  }

  // ─── Stack Splitter Resize ────────────────────────────────────────────────

  (function initSplitterResize() {
    let drag = null;

    // Mousedown: delegated on document so it fires even before full init
    document.addEventListener('mousedown', function(e) {
      const splitter = e.target.closest('.stack-splitter');
      if (!splitter) return;
      e.preventDefault();
      e.stopPropagation();

      var aboveId = splitter.dataset.splitterAbove;
      var belowId = splitter.dataset.splitterBelow;
      var aboveEl = document.querySelector('[data-splitter-col-id="' + aboveId + '"]');
      var belowEl = document.querySelector('[data-splitter-col-id="' + belowId + '"]');
      if (!aboveEl || !belowEl) return;

      var aboveCol = state.columns.find(function(c) { return c.id === aboveId; });
      var belowCol = state.columns.find(function(c) { return c.id === belowId; });
      if (!aboveCol || !belowCol) return;

      splitter.classList.add('splitter-active');

      drag = {
        splitter: splitter,
        aboveEl: aboveEl, belowEl: belowEl,
        aboveCol: aboveCol, belowCol: belowCol,
        startY: e.clientY,
        startAboveH: aboveEl.offsetHeight,
        startBelowH: belowEl.offsetHeight,
        oldAboveFlexSize: aboveCol.flexSize || 1,
        oldBelowFlexSize: belowCol.flexSize || 1,
      };
    });

    document.addEventListener('mousemove', function(e) {
      if (!drag) return;
      var startY = drag.startY;
      var startAboveH = drag.startAboveH;
      var startBelowH = drag.startBelowH;
      var aboveEl = drag.aboveEl;
      var belowEl = drag.belowEl;

      var delta = e.clientY - startY;
      var totalPx = startAboveH + startBelowH;
      var minH = 80;
      var newAboveH = Math.max(minH, Math.min(totalPx - minH, startAboveH + delta));
      var newBelowH = totalPx - newAboveH;

      // Drive flex-grow with pixel values directly (proportional, no unit needed)
      aboveEl.style.flexGrow = String(newAboveH);
      belowEl.style.flexGrow = String(newBelowH);
    });

    document.addEventListener('mouseup', function(e) {
      if (!drag) return;
      var splitter = drag.splitter;
      var aboveEl = drag.aboveEl;
      var belowEl = drag.belowEl;
      var aboveCol = drag.aboveCol;
      var belowCol = drag.belowCol;
      var oldAboveFlexSize = drag.oldAboveFlexSize;
      var oldBelowFlexSize = drag.oldBelowFlexSize;

      splitter.classList.remove('splitter-active');

      // Convert pixel-based flex-grow back to normalized flexSize
      var rawAbove = parseFloat(aboveEl.style.flexGrow) || 1;
      var rawBelow = parseFloat(belowEl.style.flexGrow) || 1;
      var oldSum = oldAboveFlexSize + oldBelowFlexSize;
      var newTotal = rawAbove + rawBelow;
      aboveCol.flexSize = (rawAbove / newTotal) * oldSum;
      belowCol.flexSize = (rawBelow / newTotal) * oldSum;

      drag = null;
      saveState();
    });

    // Cancel on escape
    document.addEventListener('keydown', function(e) {
      if (drag && e.key === 'Escape') {
        drag.splitter.classList.remove('splitter-active');
        drag.aboveEl.style.flexGrow = String(drag.oldAboveFlexSize);
        drag.belowEl.style.flexGrow = String(drag.oldBelowFlexSize);
        drag = null;
      }
    });
  })();

  function attachSmartDragHandlers(colDiv, handle, colId) {
    handle.addEventListener('dragstart', (e) => {
      e.stopPropagation();
      window._draggingColumnId = colId;
      e.dataTransfer.effectAllowed = 'move';
      e.dataTransfer.setData('text/plain', colId);
      setTimeout(() => colDiv.classList.add('column-dragging'), 10);
    });

    handle.addEventListener('dragend', () => {
      colDiv.classList.remove('column-dragging');
      clearAllDragClasses();
      window._draggingColumnId = null;
    });

    colDiv.addEventListener('dragover', (e) => {
      // Allow task drops on any column (don't block when dragState is active)
      if (dragState) {
        e.preventDefault();
        e.dataTransfer.dropEffect = 'move';

        // Show drop-target highlight on the task-list container
        const taskListEl = colDiv.querySelector('.task-list');
        if (taskListEl) {
          // Clear all other task-list highlights
          document.querySelectorAll('.task-list.drop-target-active').forEach(el => {
            if (el !== taskListEl) el.classList.remove('drop-target-active');
          });
          taskListEl.classList.add('drop-target-active');
        }

        // Show insertion indicator on individual cards
        const card = e.target.closest('.task-card');
        if (card && card.dataset.taskId !== dragState.taskId) {
          clearDragClasses();
          if (isTopHalf(e, card)) {
            card.classList.add('drag-above');
          } else {
            card.classList.add('drag-below');
          }
        }
        return;
      }

      if (!window._draggingColumnId) return;
      if (colId === window._draggingColumnId) return;
      e.preventDefault();
      e.stopPropagation();
      e.dataTransfer.dropEffect = 'move';

      clearAllDragClasses();

      const rect = colDiv.getBoundingClientRect();
      const relX = (e.clientX - rect.left) / rect.width;

      if (relX < 0.25) {
        colDiv.classList.add('column-drag-over-left');
      } else if (relX > 0.75) {
        colDiv.classList.add('column-drag-over-right');
      } else {
        const draggedCol = state.columns.find(c => c.id === window._draggingColumnId);
        const targetCol  = state.columns.find(c => c.id === colId);
        const sameStack  = draggedCol && targetCol && draggedCol.stackGroup && draggedCol.stackGroup === targetCol.stackGroup;
        if (sameStack) {
          const midY = rect.top + rect.height / 2;
          colDiv.classList.add(e.clientY < midY ? 'column-drag-over-top' : 'column-drag-over-bottom');
        } else {
          colDiv.classList.add('column-drag-combine');
        }
      }
    });

    colDiv.addEventListener('dragleave', (e) => {
      if (dragState) {
        // Remove task-list highlight when leaving column
        if (!colDiv.contains(e.relatedTarget)) {
          const taskListEl = colDiv.querySelector('.task-list');
          if (taskListEl) taskListEl.classList.remove('drop-target-active');
        }
        const card = e.target.closest('.task-card');
        if (card) {
          card.classList.remove('drag-above', 'drag-below');
        }
        return;
      }

      if (!window._draggingColumnId) return;
      if (!colDiv.contains(e.relatedTarget)) {
        colDiv.classList.remove(
          'column-drag-over-left', 'column-drag-over-right',
          'column-drag-over-top', 'column-drag-over-bottom',
          'column-drag-combine'
        );
      }
    });

    colDiv.addEventListener('drop', (e) => {
      // Handle task drops (cross-track and same-track)
      if (dragState) {
        e.preventDefault();
        e.stopPropagation();

        // Clean up visual indicators
        clearDragClasses();
        document.querySelectorAll('.task-list.drop-target-active').forEach(el => el.classList.remove('drop-target-active'));

        const sourceColId = dragState.colId;
        const draggedTaskId = dragState.taskId;
        const destColId = colId;

        const sourceCol = getColumn(sourceColId);
        const destCol = getColumn(destColId);
        if (!sourceCol || !destCol) return;

        const draggedTask = sourceCol.tasks.find(t => t.id === draggedTaskId);
        if (!draggedTask) return;

        // Find insert position among visible task cards in this column's task list
        const taskListEl = colDiv.querySelector('.task-list');
        const cardEls = taskListEl ? [...taskListEl.querySelectorAll('.task-card')] : [];
        const filteredCards = cardEls.filter(el => el.dataset.taskId !== draggedTaskId);

        let destIndex = filteredCards.length; // default: append at end
        for (let i = 0; i < filteredCards.length; i++) {
          const rect = filteredCards[i].getBoundingClientRect();
          if (e.clientY < rect.top + rect.height / 2) {
            destIndex = i;
            break;
          }
        }

        if (sourceColId === destColId) {
          // Same track: reorder within the sorted view, then reconstruct order
          const sourceIndex = sourceCol.tasks.indexOf(draggedTask);
          if (sourceIndex === -1) return;

          // Get the sorted order for this column
          const sorted = sortedTasks(sourceCol.tasks);
          const sortedWithout = sorted.filter(t => t.id !== draggedTaskId);

          // Clamp destIndex
          destIndex = Math.min(destIndex, sortedWithout.length);

          sortedWithout.splice(destIndex, 0, draggedTask);

          // Replace tasks with new order (active first, then done, then cancelled)
          const newActive = sortedWithout.filter(t => !t.done && !t.cancelled);
          const newDone = sortedWithout.filter(t => t.done && !t.cancelled);
          const newCancelled = sortedWithout.filter(t => t.cancelled);
          sourceCol.tasks = [...newActive, ...newDone, ...newCancelled];
        } else {
          // Cross-track: remove from source, insert into dest
          sourceCol.tasks = sourceCol.tasks.filter(t => t.id !== draggedTaskId);

          // Get sorted dest tasks to figure out where to insert
          const destSorted = sortedTasks(destCol.tasks);
          destIndex = Math.min(destIndex, destSorted.length);
          destSorted.splice(destIndex, 0, draggedTask);

          const newActive = destSorted.filter(t => !t.done && !t.cancelled);
          const newDone = destSorted.filter(t => t.done && !t.cancelled);
          const newCancelled = destSorted.filter(t => t.cancelled);
          destCol.tasks = [...newActive, ...newDone, ...newCancelled];
        }

        dragState = null;
        render();
        saveState();
        return;
      }

      // Handle column drops
      if (!window._draggingColumnId) return;
      e.preventDefault();
      e.stopPropagation();

      const draggedColId = window._draggingColumnId;
      clearAllDragClasses();

      if (draggedColId === colId) { window._draggingColumnId = null; return; }

      const rect   = colDiv.getBoundingClientRect();
      const relX   = (e.clientX - rect.left) / rect.width;
      const draggedCol = state.columns.find(c => c.id === draggedColId);
      const targetCol  = state.columns.find(c => c.id === colId);
      if (!draggedCol || !targetCol) { window._draggingColumnId = null; return; }

      if (relX < 0.25) {
        draggedCol.stackGroup = null;
        state.columns.splice(state.columns.findIndex(c => c.id === draggedColId), 1);
        state.columns.splice(state.columns.findIndex(c => c.id === colId), 0, draggedCol);
      } else if (relX > 0.75) {
        draggedCol.stackGroup = null;
        state.columns.splice(state.columns.findIndex(c => c.id === draggedColId), 1);
        const ti = state.columns.findIndex(c => c.id === colId);
        state.columns.splice(ti + 1, 0, draggedCol);
      } else {
        const sameStack = draggedCol.stackGroup && draggedCol.stackGroup === targetCol.stackGroup;
        if (sameStack) {
          const midY = rect.top + rect.height / 2;
          const insertBefore = e.clientY < midY;
          state.columns.splice(state.columns.findIndex(c => c.id === draggedColId), 1);
          const ti = state.columns.findIndex(c => c.id === colId);
          state.columns.splice(insertBefore ? ti : ti + 1, 0, draggedCol);
        } else {
          const newGroup = targetCol.stackGroup || ('sg-' + colId.slice(3, 10));
          targetCol.stackGroup = newGroup;
          draggedCol.stackGroup = newGroup;
          state.columns.splice(state.columns.findIndex(c => c.id === draggedColId), 1);
          const groupMembers = state.columns.filter(c => c.stackGroup === newGroup);
          const lastMember = groupMembers[groupMembers.length - 1];
          const li = state.columns.findIndex(c => c.id === lastMember.id);
          state.columns.splice(li + 1, 0, draggedCol);
        }
      }

      cleanupStackGroups();
      window._draggingColumnId = null;
      render();
      saveState();
    });
  }

  // ─── Group-aware render ───────────────────────────────────────────────────

  function renderToArea(area) {
    const scrollLeft = area.scrollLeft;
    area.innerHTML = '';

    const rendered = new Set();
    const groups = [];
    state.columns.forEach(col => {
      if (rendered.has(col.id)) return;
      if (col.stackGroup) {
        const group = state.columns.filter(c => c.stackGroup === col.stackGroup);
        group.forEach(c => rendered.add(c.id));
        groups.push(group);
      } else {
        rendered.add(col.id);
        groups.push([col]);
      }
    });

    groups.forEach(group => {
      if (group.length === 1) {
        const col = group[0];
        const el = col.isCalendar ? renderCalendarColumn(col) : renderColumn(col);
        el.style.width = '300px';
        area.appendChild(el);
      } else {
        const stack = document.createElement('div');
        // No gap-4: splitter bars provide the visual separation
        stack.className = 'flex flex-col shrink-0';
        stack.style.cssText = 'width:300px;height:100%;overflow:hidden;';

        group.forEach((col, i) => {
          const el = col.isCalendar ? renderCalendarColumn(col) : renderColumn(col);
          el.style.width = '100%';
          el.style.flexShrink = '0';
          // Use stored flexSize uniformly — calendar default is already baked into flexSize
          el.style.flexGrow = String(col.flexSize || 1);
          el.style.flexBasis = '0';
          el.style.height = '0';
          el.style.minHeight = '80px';
          el.style.overflow = 'hidden';
          // Tag for splitter targeting
          el.dataset.splitterColId = col.id;
          stack.appendChild(el);

          // Insert a splitter bar between every adjacent pair
          if (i < group.length - 1) {
            const splitter = document.createElement('div');
            splitter.className = 'stack-splitter';
            splitter.dataset.splitterAbove = col.id;
            splitter.dataset.splitterBelow = group[i + 1].id;
            splitter.setAttribute('draggable', 'false');
            stack.appendChild(splitter);
          }
        });

        area.appendChild(stack);
      }
    });

    area.scrollLeft = scrollLeft;
    lucide.createIcons();
    applyDarkMode();
    bindColumnInputs();
    refreshModalIfOpen();
  }

  function renderTracksOnly() {
    renderToArea(document.getElementById('tracks-area'));
  }

  function render() {
    renderToArea(document.getElementById('tracks-area'));
  }

  // ─── Bind per-column inputs ───────────────────────────────────────────────

  function bindColumnInputs() {
    document.querySelectorAll('.add-task-input').forEach(input => {
      input.removeEventListener('keydown', onAddTaskKeydown);
      input.addEventListener('keydown', onAddTaskKeydown);
    });
  }

  async function onAddTaskKeydown(e) {
    if (e.key === 'Enter') {
      e.preventDefault();
      const colId = e.target.dataset.colId;
      const text = e.target.value.trim();
      if (!text) return;
      const col = getColumn(colId);
      if (!col) return;
      const newTask = { id: uid(), text, done: false, notes: '', percent: 0, inProgress: false, cancelled: false };

      const firstDoneIndex = col.tasks.findIndex(t => t.done === true);
      if (firstDoneIndex === -1) {
        col.tasks.push(newTask);
      } else {
        col.tasks.splice(firstDoneIndex, 0, newTask);
      }

      e.target.value = '';
      render();
      const newInput = document.querySelector(`.add-task-input[data-col-id="${colId}"]`);
      if (newInput) newInput.focus();
      saveState();
    } else if (e.key === 'Escape') {
      e.target.value = '';
      e.target.blur();
    }
  }

  // ─── Inline column title edit ─────────────────────────────────────────────

  function startEditTitle(colId) {
    const col = getColumn(colId);
    if (!col) return;
    const titleEl = document.querySelector(`[data-action="edit-col-title"][data-col-id="${colId}"]`);
    if (!titleEl) return;

    const input = document.createElement('input');
    input.className = 'track-title-input text-foreground-850 dark:text-background-150';
    input.value = col.title;
    input.style.minWidth = '0';
    titleEl.replaceWith(input);
    input.focus();
    input.select();

    const save = async () => {
      const newTitle = input.value.trim() || col.title;
      col.title = newTitle;
      render();
      saveState();
    };

    input.addEventListener('blur', save);
    input.addEventListener('keydown', async (e) => {
      if (e.key === 'Enter') { e.preventDefault(); input.blur(); }
      else if (e.key === 'Escape') { input.value = col.title; input.blur(); }
    });
  }

  // ─── Inline task title edit ───────────────────────────────────────────────

  function startEditTaskTitle(colId, taskId, textEl) {
    const task = getTask(colId, taskId);
    if (!task) return;

    if (!textEl) {
      textEl = document.querySelector(
        `[data-action="edit-task-title"][data-task-id="${taskId}"][data-col-id="${colId}"]`
      );
    }
    if (!textEl) return;

    const originalText = task.text;

    const input = document.createElement('input');
    input.type = 'text';
    input.className = 'task-title-input';
    input.value = originalText;
    input.style.textDecoration = 'none';
    input.style.fontStyle = 'normal';
    input.style.opacity = '1';
    if (document.documentElement.classList.contains('dark')) {
      input.style.color = '#efeae7';
    } else {
      input.style.color = '#272320';
    }

    textEl.replaceWith(input);
    input.focus();
    input.select();

    let saved = false;

    const save = () => {
      if (saved) return;
      saved = true;
      const newText = input.value.trim();
      if (newText) task.text = newText;
      render();
      saveState();
    };

    const cancel = () => {
      if (saved) return;
      saved = true;
      render();
    };

    input.addEventListener('click', (e) => { e.stopPropagation(); });

    input.addEventListener('blur', save);

    input.addEventListener('keydown', (e) => {
      e.stopPropagation();
      if (e.key === 'Enter') {
        e.preventDefault();
        input.blur();
      } else if (e.key === 'Escape') {
        task.text = originalText;
        cancel();
      }
    });
  }

  // ─── Drag and Drop Helpers (Tasks) ────────────────────────────────────────

  function clearDragClasses() {
    document.querySelectorAll('.task-card').forEach(card => {
      card.classList.remove('drag-above', 'drag-below');
    });
  }

  function isTopHalf(e, el) {
    const rect = el.getBoundingClientRect();
    return e.clientY < rect.top + rect.height / 2;
  }

  // ─── Event Delegation ─────────────────────────────────────────────────────

  function initEventDelegation() {
    const tracksArea = document.getElementById('tracks-area');

    // ── Task drag: dragstart on any task card (entire card is draggable)
    tracksArea.addEventListener('dragstart', (e) => {
      // If this is a column drag handle, let that handler handle it
      if (window._draggingColumnId) return;
      const colDragHandle = e.target.closest('[data-action="column-drag-handle"]');
      if (colDragHandle) return; // column drag, not task drag

      const card = e.target.closest('.task-card');
      if (!card) return;

      // Don't start drag from interactive elements
      const interactiveTarget = e.target.closest('[data-action="toggle-task"], [data-action="delete-task"], [data-action="open-task-modal"], textarea, input, button');
      if (interactiveTarget) {
        e.preventDefault();
        return;
      }

      const taskId = card.dataset.taskId;
      const colId = card.dataset.colId;
      const taskIndex = parseInt(card.dataset.taskIndex, 10) || 0;

      dragState = { taskId, colId, taskIndex };
      e.dataTransfer.effectAllowed = 'move';
      e.dataTransfer.setData('text/plain', JSON.stringify({ trackId: colId, taskIndex: taskIndex }));

      setTimeout(() => {
        if (card) card.classList.add('dragging');
      }, 10);
    });

    // ── Task drag: dragover on tracksArea for cards between columns
    tracksArea.addEventListener('dragover', (e) => {
      if (window._draggingColumnId) return; // column drag handled elsewhere
      if (!dragState) return;

      e.preventDefault();
      e.dataTransfer.dropEffect = 'move';

      // Individual card indicators are handled by column-level dragover
    });

    tracksArea.addEventListener('dragleave', (e) => {
      if (window._draggingColumnId) return;
      const card = e.target.closest('.task-card');
      if (card) {
        card.classList.remove('drag-above', 'drag-below');
      }
    });

    // ── Task drag: drop (handled by column-level drop in attachSmartDragHandlers)
    // This is a fallback for drops that land on the tracks area itself (not on a column)
    tracksArea.addEventListener('drop', async (e) => {
      if (window._draggingColumnId) return;
      if (!dragState) return;

      // Clean up
      clearDragClasses();
      document.querySelectorAll('.task-list.drop-target-active').forEach(el => el.classList.remove('drop-target-active'));
      dragState = null;
    });

    tracksArea.addEventListener('dragend', () => {
      document.querySelectorAll('.task-card').forEach(card => {
        card.classList.remove('dragging', 'drag-above', 'drag-below');
      });
      document.querySelectorAll('.task-list.drop-target-active').forEach(el => el.classList.remove('drop-target-active'));
      dragState = null;
    });

    tracksArea.addEventListener('dblclick', (e) => {
      const titleEl = e.target.closest('[data-action="edit-task-title"]');
      if (titleEl) {
        e.stopPropagation();
        const { taskId, colId } = titleEl.dataset;
        if (titleClickTimers[taskId]) {
          clearTimeout(titleClickTimers[taskId].timer);
          delete titleClickTimers[taskId];
        }
        openModal(colId, taskId);
        return;
      }
    });

    tracksArea.addEventListener('click', async (e) => {
      const target = e.target;

      const toggleEl = target.closest('[data-action="toggle-task"]');
      if (toggleEl) {
        const { colId, taskId } = toggleEl.dataset;
        const task = getTask(colId, taskId);
        if (task) {
          task.done = !task.done;
          if (task.done) {
            task.percent = 100;
            const col = getColumn(colId);
            if (col) {
              col.tasks = col.tasks.filter(t => t.id !== task.id);
              col.tasks.push(task);
            }
          } else {
            task.percent = 0;
            const col = getColumn(colId);
            if (col) {
              col.tasks = col.tasks.filter(t => t.id !== task.id);
              const firstDoneIdx = col.tasks.findIndex(t => t.done);
              if (firstDoneIdx === -1) col.tasks.push(task);
              else col.tasks.splice(firstDoneIdx, 0, task);
            }
          }
          render();
          saveState();
        }
        return;
      }

      const openModalEl = target.closest('[data-action="open-task-modal"]');
      if (openModalEl) {
        const { colId, taskId } = openModalEl.dataset;
        openModal(colId, taskId);
        return;
      }

      const editTaskTitleEl = target.closest('[data-action="edit-task-title"]');
      if (editTaskTitleEl) {
        e.stopPropagation();
        const { colId, taskId } = editTaskTitleEl.dataset;

        if (titleClickTimers[taskId]) {
          clearTimeout(titleClickTimers[taskId].timer);
          delete titleClickTimers[taskId];
        }

        const capturedEl = editTaskTitleEl;
        titleClickTimers[taskId] = {
          timer: setTimeout(() => {
            delete titleClickTimers[taskId];
            startEditTaskTitle(colId, taskId, capturedEl);
          }, TITLE_CLICK_DELAY),
          colId,
        };
        return;
      }

      const delTaskEl = target.closest('[data-action="delete-task"]');
      if (delTaskEl) {
        const { colId, taskId } = delTaskEl.dataset;
        const col = getColumn(colId);
        if (!col) return;
        const card = delTaskEl.closest('.task-card');
        if (card) {
          card.classList.add('removing');
          await new Promise(r => setTimeout(r, 170));
        }
        col.tasks = col.tasks.filter(t => t.id !== taskId);
        render();
        saveState();
        return;
      }

      const editColEl = target.closest('[data-action="edit-col-title"]');
      if (editColEl) {
        startEditTitle(editColEl.dataset.colId);
        return;
      }

      const delColEl = target.closest('[data-action="delete-col"]');
      if (delColEl) {
        const colId = delColEl.dataset.colId;
        if (colDeletePending[colId]) {
          await doDeleteColumn(colId);
        } else {
          startColDeleteConfirm(colId);
        }
        return;
      }
    });

    tracksArea.addEventListener('contextmenu', (e) => {
      const card = e.target.closest('.task-card');
      if (!card) return;
      e.preventDefault();
      e.stopPropagation();
      const { colId, taskId } = card.dataset;
      showContextMenu(e.clientX, e.clientY, colId, taskId);
    });
  }

  // ─── Top bar buttons ──────────────────────────────────────────────────────

  function initTopBar() {
    document.getElementById('btn-add-track').addEventListener('click', async () => {
      state.trackCounter++;
      const newCol = {
        id: uid(),
        title: `Track ${state.trackCounter}`,
        tasks: [],
        isCalendar: false,
        stackGroup: null,
        flexSize: 1,
      };
      state.columns.push(newCol);
      render();
      setTimeout(() => {
        const area = document.getElementById('tracks-area');
        area.scrollTo({ left: area.scrollWidth, behavior: 'smooth' });
        const newInput = document.querySelector(`.add-task-input[data-col-id="${newCol.id}"]`);
        if (newInput) newInput.focus();
      }, 50);
      saveState();
    });

    document.getElementById('btn-reset-all').addEventListener('click', async () => {
      if (resetPending) {
        await doReset();
      } else {
        startResetConfirm();
      }
    });

    document.getElementById('btn-dark-mode').addEventListener('click', async () => {
      state.darkMode = !state.darkMode;
      applyDarkMode();
      saveSettings();
    });

    document.getElementById('btn-settings').addEventListener('click', () => {
      openSettingsModal();
    });

    document.getElementById('btn-export').addEventListener('click', () => {
      doExport();
    });

    document.getElementById('btn-import').addEventListener('click', () => {
      doImport();
    });

    document.getElementById('import-file-input').addEventListener('change', (e) => {
      const file = e.target.files && e.target.files[0];
      if (file) {
        handleImportFile(file);
      }
    });
  }

  // ─── Boot ─────────────────────────────────────────────────────────────────

  (async () => {
    const overlay = document.getElementById('loading-overlay');

    await loadSettings();
    applyDarkMode();

    await loadState();
    migrateCalendar();

    if (overlay) {
      overlay.style.display = 'none';
    }

    render();
    lucide.createIcons();
    initEventDelegation();
    initTopBar();
    initModal();
    initSettingsModal();
    initContextMenu();

    if (window.navigator.standalone === true) {
      const btn = document.getElementById('btn-dark-mode');
      if (btn) btn.style.marginRight = '48px';
    }
  })();

})();
</script>
